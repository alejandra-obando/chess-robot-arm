; PlatformIO project file for ESP32 #2 -- the chessboard's firmware.
; Scans the 8x8 reed-switch matrix (rows direct, columns through a
; CD74HC4067 16-channel analog multiplexer) and reports occupancy to the PC.
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -Wall
    -Wextra
