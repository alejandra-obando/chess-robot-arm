; PlatformIO project file for ESP32 #1 -- the robotic arm's firmware.
; Drives 6 MG996R servos through a PCA9685 PWM driver over I2C.
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
build_flags =
    -Wall
    -Wextra
