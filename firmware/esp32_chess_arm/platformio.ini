; PlatformIO project file for the chess-playing arm's ESP32 firmware.
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    madhephaestus/ESP32Servo @ ^3.0.5
build_flags =
    -Wall
    -Wextra
